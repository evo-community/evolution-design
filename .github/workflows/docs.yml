name: docs

# Push to main touching apps/docs: build the docs image, push it to the registry
# and roll it out by committing the new tag to the cluster repository (Argo CD picks it up).
on:
  push:
    branches: [main]
    paths: [apps/docs/**]
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE: paromov.registry.twcstorage.ru/community/ed-docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # apps/docs is a workspace: install and build from the root lockfile.
      - run: npm ci
      - run: npx turbo run build --filter=@evod/docs
      - name: runtime Dockerfile
        run: |
          cat > "$RUNNER_TEMP/docs.Dockerfile" <<'EOF'
          FROM nginx:alpine
          COPY nginx/nginx.conf /etc/nginx/nginx.conf
          COPY dist /usr/share/nginx/html
          EXPOSE 8080
          EOF
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: paromov.registry.twcstorage.ru
          username: paromov
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: apps/docs
          file: ${{ runner.temp }}/docs.Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/checkout@v4
        with:
          repository: EvgenyParomov/cluster
          ssh-key: ${{ secrets.CLUSTER_DEPLOY_KEY }}
          path: .cluster
      - name: roll out
        working-directory: .cluster
        run: |
          sed -i -E "s#(${IMAGE}):[^ ]+#\1:${{ steps.tag.outputs.tag }}#g" projects/community/apps.yaml
          git config user.name "ed-docs build"
          git config user.email "build@evocomm.space"
          git commit -am "community: ed-docs ${{ steps.tag.outputs.tag }}" || exit 0
          git push
