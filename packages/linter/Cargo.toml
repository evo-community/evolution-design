[package]
name = "ed-linter"
version = "0.1.0"
edition = "2021"
description = "CLI tool for Evolution Design linting"
authors = [ "Evolution Design Team" ]

[dependencies]
clap = { version = "4.4", features = [ "derive" ] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0.12"
tokio = { version = "1.0", features = [ "full" ] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }

[[bin]]
name = "ed-lint"
path = "src/main.rs"

[lib]
name = "ed_linter"
path = "src/lib.rs"

[dev-dependencies]
tempfile = "3.8"
